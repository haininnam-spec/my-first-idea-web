<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 첫번째 아이디어</title>
    <meta name="description" content="화면 중앙에 아름답게 배치된 내 첫번째 아이디어 웹페이지입니다.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;800;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Ambient glowing background blobs -->
    <div class="bg-glow blob-1"></div>
    <div class="bg-glow blob-2"></div>
    <div class="bg-glow blob-3"></div>
    <div class="mouse-glow" id="mouseGlow"></div>

    <!-- Background Grid overlay -->
    <div class="grid-overlay"></div>

    <!-- Main Container centered -->
    <main class="container">
        <div class="glass-card" id="card">
            <div class="badge">
                <span class="badge-dot"></span>
                <span>DAY 0 • MY FIRST IDEA</span>
            </div>
            
            <h1 class="main-title" id="titleText">
                내 첫번째 아이디어
            </h1>
            
            <p class="sub-text">
                위대한 모든 혁신은 하나의 작은 아이디어로부터 시작됩니다.
            </p>

            <div class="card-footer">
                <button class="action-btn" id="sparkleBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                    <span>영감 더하기</span>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
